<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>プロトタイプ詳細</title>
</head>
<body>
    <h1 th:text="${prototype.name}">プロトタイプ名</h1>
    <p th:text="${prototype.catchCopy}">キャッチコピー</p>
    <p th:text="${prototype.concept}">コンセプト</p>
    <p th:text="${prototype.userName}">投稿者名</p>
    <img th:src="@{/images/{img}(img=${prototype.imageName})}" th:alt="${prototype.imageName}" />
    <span th:text="${prototype.imageName}">画像名</span>

    <div th:if="${isOwner}">
        <a th:href="@{/prototypes/{id}/edit(id=${prototype.id})}">編集</a>
        <form th:action="@{/prototypes/{id}/delete(id=${prototype.id})}" method="post">
            <!-- <a th:href="@{/prototypes/{id}/delete(id=${prototype.id})}">削除</a> -->
            <button type="submit">削除する</button>
        </form>
    </div>

    <!-- コメント一覧 -->
    <div th:each="comment : ${comments}">
        <span th:text="${comment.content}">コメント内容</span>
        <span th:text="${comment.userName}">投稿者名</span>
    </div>

    <!-- ログイン時のみ表示 -->
    <div th:if="${isLoggedIn}">
        <form th:action="@{/prototypes/{id}/comments(id=${prototype.id})}" method="post">
            <textarea name="content"></textarea>
            <button type="submit">コメント投稿</button>
        </form>
    </div>
</body>
</html>

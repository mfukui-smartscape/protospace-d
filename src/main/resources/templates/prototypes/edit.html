<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8"/>
  <title>Prototype Edit</title>
  <link th:href="@{/css/prototypes/edit.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="edit-container">
    <h1>プロトタイプ編集</h1>

    <form th:action="@{/prototypes/{id}(id=${prototype.id})}" method="post" enctype="multipart/form-data">
      <div class="prototype_subtitle">プロトタイプの名称</div>
      <input type="text" name="name" th:value="${prototypeForm.name}" />
      <div class="prototype_subtitle">キャッチコピー</div>
      <input type="text" name="catchCopy" th:value="${prototypeForm.catchCopy}" />
      <div class="prototype_subtitle">コンセプト</div>
      <textarea name="concept" th:text="${prototypeForm.concept}"></textarea>
      <div class="prototype_subtitle">プロトタイプの画像</div>
      <input type="file" name="imageName" />
      <button type="submit" class="prototype_submit">保存する</button>
    </form>
  </div>
</body>
</html>

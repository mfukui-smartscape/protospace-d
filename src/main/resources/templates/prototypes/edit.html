<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロトタイプ編集</title>
</head>
<body>
    <h1>プロトタイプ編集</h1>
    <form th:action="@{/prototypes/{id}(id=${prototypeId})}" th:object="${prototypeForm}" method="post">
        <div>
            <label for="name">プロトタイプ名</label>
            <input type="text" id="name" th:field="*{name}" data-testid="prototype-name-input" />
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></p>
        </div>
        <div>
            <label for="catchCopy">キャッチコピー</label>
            <input type="text" id="catchCopy" th:field="*{catchCopy}" data-testid="prototype-catchcopy-input" />
            <p th:if="${#fields.hasErrors('catchCopy')}" th:errors="*{catchCopy}" class="error"></p>
        </div>
        <div>
            <label for="concept">コンセプト</label>
            <textarea id="concept" th:field="*{concept}" data-testid="prototype-concept-input"></textarea>
            <p th:if="${#fields.hasErrors('concept')}" th:errors="*{concept}" class="error"></p>
        </div>
        <button type="submit" data-testid="prototype-update-button">更新</button>
    </form>
</body>
</html>
